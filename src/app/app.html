<a href="#main-content" class="skip-link">Skip to main content</a>

<app-floating-notes />

<div class="shell">
  <app-nav
    [stageName]="d.stageName"
    [bookingEmail]="d.bookingEmail"
    [hasVideos]="d.videos.length > 0"
  />

  <app-hero [data]="d" />

  <main id="main-content">
    <app-bio [data]="d" />
    <app-experience [experience]="d.experience" />
    <app-repertoire
      [repertoire]="d.repertoire"
      [repertoireFootnote]="d.repertoireFootnote"
      [repertoireFootnoteLead]="d.repertoireFootnoteLead"
      [repertoireRecordingTeaser]="d.repertoireRecordingTeaser"
      [repertoireMusicLink]="d.repertoireMusicLink"
    />
    <app-gallery
      [gallery]="d.gallery"
      [photoAlbumLinks]="d.photoAlbumLinks"
      [linkToVideosSection]="d.videos.length > 0"
    />
    <app-videos [videos]="d.videos" />
    <app-t-blu-blog [blog]="d.tBluBlog" />
    <app-contact
      [bookingEmail]="d.bookingEmail"
      [bookingEmailAlt]="d.bookingEmailAlt"
      [bookingEmailInfo]="d.bookingEmailInfo"
      [bookingContact]="d.bookingContact"
    />
  </main>

  <app-footer
    [stageName]="d.stageName"
    [footerCreditPartner]="d.footerCreditPartner ?? ''"
    [footerCreditPartnerGithubUrl]="d.footerCreditPartnerGithubUrl ?? ''"
  />
</div>
