<app-floating-notes />

<div class="shell">
  <app-nav [stageName]="d.stageName" />

  <app-hero [data]="d" />

  <main id="main-content">
    <app-bio [data]="d" />
    <app-experience [experience]="d.experience" />
    <app-repertoire
      [repertoire]="d.repertoire"
      [repertoireFootnote]="d.repertoireFootnote"
      [repertoireMusicLink]="d.repertoireMusicLink"
      [repertoireListenBlurb]="d.repertoireListenBlurb"
    />
    <app-gallery [gallery]="d.gallery" [videos]="d.videos" [photoAlbumLinks]="d.photoAlbumLinks" />
    <app-contact
      [bookingEmail]="d.bookingEmail"
      [bookingContact]="d.bookingContact"
    />
  </main>
</div>
