<a href="#main-content" class="skip-link">Skip to main content</a>

<app-floating-notes />

<div class="shell">
  <app-nav [stageName]="d.stageName" [bookingEmail]="d.bookingEmail" />

  <app-hero [data]="d" />

  <main id="main-content">
    <app-bio [data]="d" />
    <app-experience [experience]="d.experience" />
    <app-repertoire
      [repertoire]="d.repertoire"
      [repertoireFootnote]="d.repertoireFootnote"
      [repertoireFootnoteLead]="d.repertoireFootnoteLead"
      [repertoireRecordingTeaser]="d.repertoireRecordingTeaser"
      [repertoireMusicLink]="d.repertoireMusicLink"
    />
    <app-gallery [gallery]="d.gallery" [videos]="d.videos" [photoAlbumLinks]="d.photoAlbumLinks" />
    <app-contact [bookingEmail]="d.bookingEmail" [bookingContact]="d.bookingContact" />
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="site-footer-inner">
      <p class="site-footer-copy">
        @if (d.footerCreditPartner?.trim()) {
          © {{ copyrightYear }} {{ d.stageName }} and {{ d.footerCreditPartner }}. All rights reserved.
        } @else {
          © {{ copyrightYear }} {{ d.stageName }}. All rights reserved.
        }
      </p>
    </div>
  </footer>
</div>
