<div class="gallery-root">
<section class="section" id="gallery" aria-labelledby="gal-heading">
  <div class="section-wrap">
    <div class="section-head" appRevealOnScroll>
      <span class="eyebrow">Gallery</span>
      <h2 id="gal-heading">Stage presence with a bold piano-inspired visual identity</h2>
      <div class="rule"><div class="rule-line"></div><span class="rule-note">♪</span><div class="rule-line rev"></div></div>
    </div>
    <div class="gal-grid">
      @for (img of gallery; track img.alt) {
        <figure class="gal-card" appRevealOnScroll>
          <button
            type="button"
            class="gal-trigger"
            (click)="openLightbox(img)"
            [attr.aria-label]="'View larger: ' + img.alt"
          >
            <div class="gal-img">
              <span class="gal-icon" aria-hidden="true">𝄞</span>
              <img [src]="img.src" [alt]="img.alt" loading="lazy">
              <div class="gal-overlay"><p class="gal-caption">{{ img.caption }}</p></div>
            </div>
          </button>
          <figcaption class="gal-caption-mobile">{{ img.caption }}</figcaption>
        </figure>
      }
    </div>

    @if (videos.length) {
      <div class="videos-block" appRevealOnScroll>
        <p class="videos-eyebrow">Videos</p>
        <div class="video-grid">
          @for (v of videos; track v.embedSrc) {
            <div class="video-card">
              <p class="video-title">{{ v.title }}</p>
              <div class="video-embed">
                <iframe
                  [title]="v.title"
                  [src]="safeEmbed(v.embedSrc)"
                  loading="lazy"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                  allowfullscreen
                ></iframe>
              </div>
            </div>
          }
        </div>
      </div>
    }
  </div>
</section>

@if (lightbox) {
  <div
    class="lightbox-backdrop"
    (click)="closeLightbox()"
    role="presentation"
    aria-hidden="true"
  ></div>
  <div
    class="lightbox-dialog"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="lightbox.alt"
  >
    <button type="button" class="lightbox-close" (click)="closeLightbox()" aria-label="Close image">
      ×
    </button>
    <img class="lightbox-img" [src]="lightbox.src" [alt]="lightbox.alt" />
    <p class="lightbox-caption">{{ lightbox.caption }}</p>
  </div>
}
</div>
