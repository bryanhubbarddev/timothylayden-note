<div class="piano-bar" aria-hidden="true" role="img" aria-label="Decorative 88-key piano keyboard">
  <div class="keys-row">
    <div class="keys-row-clip">
      <div class="keys-row-inner" [ngStyle]="innerStyle">
        @for (k of layout.whiteKeys; track k.midi) {
          <div
            class="wk"
            [class.wk--dip]="k.dip"
            [style.left.px]="k.left"
            [style.animation-delay]="k.dip ? k.dipDelay : ''"
          ></div>
        }
        @for (k of layout.blackKeys; track k.midi) {
          <div
            class="bk"
            [class.bk--glow]="k.glow"
            [style.left.px]="k.left"
            [style.animation-delay]="k.glow ? k.glowDelay : ''"
          ></div>
        }
      </div>
    </div>
  </div>
</div>
