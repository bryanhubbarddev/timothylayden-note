<header class="navbar" role="banner">
  <nav class="nav-inner" aria-label="Main">
    @if (brandMailto) {
      <a
        class="brand brand-mailto"
        [href]="brandMailto"
        [attr.aria-label]="'Email ' + stageName + ' at ' + bookingEmail"
      >
        <div class="brand-circle"><span class="brand-initials">TL</span></div>
        <div class="brand-label">
          <span class="brand-tag">Live Piano</span>
          <span class="brand-name-text">{{ stageName }}</span>
        </div>
      </a>
    } @else {
      <div class="brand">
        <div class="brand-circle"><span class="brand-initials">TL</span></div>
        <div class="brand-label">
          <span class="brand-tag">Live Piano</span>
          <span class="brand-name-text">{{ stageName }}</span>
        </div>
      </div>
    }
    <div class="nav-links">
      <button type="button" (click)="scrollTo('about')">About</button>
      <button type="button" (click)="scrollTo('experience')">Experience</button>
      <button type="button" (click)="scrollTo('repertoire')">Repertoire</button>
      <button type="button" (click)="scrollTo('gallery')">Gallery</button>
      @if (hasVideos) {
        <button type="button" (click)="scrollTo('videos')">Videos</button>
      }
      @if (bookNowMailto) {
        <a
          [href]="bookNowMailto"
          class="nav-book"
          [attr.aria-label]="'Email booking request to ' + bookingEmail"
          >Book Now</a>
      } @else {
        <button type="button" (click)="scrollTo('contact')" class="nav-book">Book Now</button>
      }
    </div>
  </nav>
</header>
